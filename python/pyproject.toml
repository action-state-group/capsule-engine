[build-system]
# >=77.0.3 for PEP 639 `license` and `license-files`, as in the sibling repos.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-engine"
version = "0.2.0"
description = "The thin single-node engine: guard, append-only fold compute, packs, policy activation, and the report computation for AI agent actions."
readme = "README.md"
# typing.NotRequired (PEP 655) is 3.11 and later.
requires-python = ">=3.11"
# The tau2-bench data under examples/data/tau2_airline is MIT (Sierra Research).
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "capsule_engine/examples/data/tau2_airline/LICENSE-tau2-bench"]
authors = [{ name = "Action State Group" }]
keywords = ["agent", "guard", "fold", "capsule", "engine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Capsule parsing goes through the public agent-action-capsule reference
# library -- never vendored into this repo. Ledger storage is owned by
# checkpointed-local-log (cll). This package's registry/ is the interim
# vendor-of-record copy of the action-class and field conventions.
dependencies = [
    "agent-action-capsule>=0.11.0",
    # cll.ledger: LedgerStore, LedgerAPI, ScanQuery, LedgerRecord and
    # VerificationResult. They replaced the archived capsule-ledger (#170),
    # whose ledger modules were aliases for these.
    "checkpointed-local-log>=0.6.0",
    # capsule_engine/schemas/evidence-contract-v0.json's validator entry point
    # (packs/contract_validate.py).
    "jsonschema>=4.18",
    # capsule_emit.ledger_io, .period and .evidence_file: the read/verify seam,
    # --period sugar and thread-bundle check. 0.12.0 is the first release that
    # works with agent-action-capsule 0.10 and later. Capped below 0.13, whose
    # ledger layout refuses the flat ledger writes the engine and its tests make.
    "capsule-emit>=0.12.0,<0.13",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-engine"
Source = "https://github.com/action-state-group/capsule-engine"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mcp>=1.0,<2.0", "agentrust-trace>=0.10.0"]
# Pinned below 2.0: the 2.0 release restructured the package (split out
# mcp-types) and dropped the `mcp.server.fastmcp` import path this server
# uses -- see capsule_engine/mcp/server.py.
mcp = ["mcp>=1.0,<2.0"]
# trace-record/1 reader: depends on the
# published agentrust-trace package for TRACE v0.2 schema validation and
# signature verification -- never re-implemented or vendored. Optional: a
# deployment that never reads a TRACE record does not need this installed
# (packs/trace_reader.py imports it locally, same pattern
# capsule-emit-mesh's trace_citation.py already established).
trace = ["agentrust-trace>=0.10.0"]

[project.scripts]
capsule-engine = "capsule_engine.cli:main"
# A capsulectl plugin (cli-plugin/v1): `capsulectl engine check --ruleset FILE`.
capsulectl-engine = "capsule_engine.cli.engine_plugin:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_engine*"]

[tool.setuptools.package-data]
capsule_engine = [
    "telemetry/fixtures/*.jsonl",
    "folds/catalog_defs/*.yaml",
    "guards/action_taxonomy.json",
    "guards/action_taxonomy_v*.json",
    "guards/wickets/catalog_defs/*.yaml",
    "policy/catalog_defs/*.yaml",
    "packs/catalog/*/pack.yaml",
    "packs/catalog/*/AI-BOOTSTRAP.md",
    "packs/catalog/*/folds/*.yaml",
    "packs/catalog/*/wickets/*.yaml",
    "packs/catalog/*/fixtures/*.jsonl",
    "packs/catalog/*/register.yaml",
    "packs/catalog/*/obligations-register.yaml",
    "packs/catalog/*/obligations-pack-note.md",
    "packs/catalog/*/fixtures/trace/*.json",
    "examples/data/tau2_airline/*.jsonl",
    "examples/data/tau2_airline/*.json",
    "registry/*.json",
    "schemas/*.json",
    "schemas/vendor/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
# The Go guard's vector generators are frozen with the vectors they wrote
# (each pinned by sha256 in its set's PROVENANCE.json), so they are not linted.
# CI runs ruff from the repository root with --config python/pyproject.toml,
# which resolves this path against the root.
extend-exclude = ["go/guard/testdata"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# Named, because a run from the repository root does not find the package
# under the default src.
[tool.ruff.lint.isort]
known-first-party = ["capsule_engine"]
