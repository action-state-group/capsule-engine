# SPDX-License-Identifier: Apache-2.0
# EU AI Act obligation register: the agent-relevant obligations of
# Regulation (EU) 2024/1689, as amended by Regulation (EU) 2026/1744, one row
# per obligation.
#
# `EvidenceCompiler.compile_obligations` turns this register into the
# deterministic obligations pack: every row whose evidence class can be
# checked mechanically from sealed records (FACT, RULE, CONFIRM, DOC) is
# compiled into an obligation-profile EvidenceContract, and every other row
# is listed as excluded with a named reason. See `obligations-pack-note.md`
# beside this file for the compiled and excluded lists.
#
# How each row's `evidence_class` was assigned: a row with any judged
# component (a model or human reading of free text, even as a fallback) is
# JUDGED, and a row that needs a live read of an external system of record is
# STATE -- neither can be established from sealed records alone, so neither
# is compiled. A row whose evidence combines only deterministic classes takes
# the first class its evidence description names (for example "DOC + FACT"
# is DOC, so it keeps the presence-by-digest-only disclaimer).
#
# The five rows `register.yaml` already carries (EU-04, EU-14-3, EU-50-1,
# EU-53, EU-75) are copied here verbatim; `tests/test_register_obligations.py`
# fails if the two files drift apart on any of them.
#
# The Annex I row (agents embedded in Annex I products) is not a row here: it
# adds no evidence of its own, it only changes when the Article 6-27 rows
# below apply.
#
# `clause.contested: true` marks the rows whose literal text applies from
# 2 Aug 2026 but presupposes the high-risk regime that applies from
# 2 Dec 2027. Whether such a row binds a given deployment before then is a
# legal reading, not a check, so the compiler excludes contested rows too.
register_id: asg/eu-ai-act-obligations-register/0.1.0
rows:
