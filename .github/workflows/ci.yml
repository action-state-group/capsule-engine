name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: .
        run: ruff check --config python/pyproject.toml .
      - name: pytest
        run: pytest -q
      - name: release helper tests
        run: pytest -q ../.github/test_release.py

  # Every job above tests the editable install, where the checkout is on disk
  # whatever the wheel ships. This one builds the wheel, installs it into a
  # fresh venv with its declared dependencies, and runs the schema-backed
  # calls from outside the checkout.
  clean-room-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build, install into a fresh venv, run the clean-room check
        run: bash scripts/clean_room_wheel.sh
