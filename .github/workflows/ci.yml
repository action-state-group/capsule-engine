name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # capsule-ledger is archived: FROZEN at its final commit, as in pyproject.toml (2026-10-04).
      - name: install capsule-ledger (not yet on PyPI)
        run: pip install "capsule-ledger @ git+https://github.com/action-state-group/capsule-ledger.git@42fb45f69b067f623a4b9915ae8883dff22d5d27"
      - name: install capsule-emit (ledger_io/period not yet in a PyPI release)
        # --force-reinstall: capsule-ledger's own install above already satisfies
        # "capsule-emit" from PyPI at the pinned floor, so a plain `pip install`
        # here is a silent no-op -- pip matches on version number, not source.
        # Pinned to the emit-ledger-io-home branch because capsule-emit main
        # does not have ledger_io/period yet -- repoint to plain
        # "capsule-emit @ git+.../capsule-emit.git" (no @branch) once that PR
        # merges, then drop this step entirely once the next capsule-emit
        # release (>=0.9.0, see pyproject.toml's dependency comment) is cut
        # and this repo's floor is bumped to match it. This PR is gated on
        # the capsule-emit PR merging first.
        run: >
          pip install --force-reinstall --no-deps
          "capsule-emit[ledger-io] @ git+https://github.com/action-state-group/capsule-emit.git@emit-ledger-io-home"
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  # Every job above tests the editable install, where the checkout is on disk
  # whatever the wheel ships. This one builds the wheel, installs it into a
  # fresh venv with its declared dependencies, and runs the schema-backed
  # calls from outside the checkout.
  clean-room-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build, install into a fresh venv, run the clean-room check
        run: bash scripts/clean_room_wheel.sh
