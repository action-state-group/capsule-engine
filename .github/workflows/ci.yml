name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # capsule-ledger is archived: FROZEN at its final commit, as in pyproject.toml (2026-10-04).
      - name: install capsule-ledger (not yet on PyPI)
        run: pip install "capsule-ledger @ git+https://github.com/action-state-group/capsule-ledger.git@42fb45f69b067f623a4b9915ae8883dff22d5d27"
      - name: install capsule-emit (main, pinned; ledger_io, period and evidence_file)
        # --force-reinstall: capsule-ledger's own install above already satisfies
        # "capsule-emit" from PyPI at the pinned floor, so a plain `pip install`
        # here is a silent no-op -- pip matches on version number, not source.
        # capsule-emit main (0.9.0) carries ledger_io/period (once on the
        # emit-ledger-io-home branch, no longer an extra) and evidence_file, which
        # the sale-bundle replay verifies thread bundles with. Pinned to a main
        # commit; drop this step once 0.9.0 is on PyPI and this repo's floor
        # is bumped to it.
        run: >
          pip install --force-reinstall --no-deps
          "capsule-emit @ git+https://github.com/action-state-group/capsule-emit.git@2a679547bdeddfbb8355f423a6bd95d4ddb354f7#subdirectory=python"
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  # Every job above tests the editable install, where the checkout is on disk
  # whatever the wheel ships. This one builds the wheel, installs it into a
  # fresh venv with its declared dependencies, and runs the schema-backed
  # calls from outside the checkout.
  clean-room-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build, install into a fresh venv, run the clean-room check
        run: bash scripts/clean_room_wheel.sh
