name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      # test_countersign_anchor.py runs the countersign module through the real
      # recompute_statement of capsule-anchor main at #100 (capsule-engine#294, #296).
      - name: capsule-anchor (countersign compat test)
        run: pip install "capsule-anchor @ git+https://github.com/action-state-group/capsule-anchor@78a69853bc83c9c65b9fe79a8270b83727c55304"
      - name: ruff
        working-directory: .
        run: ruff check --config python/pyproject.toml .
      # Parallel (pytest-xdist). tests/test_generate_go_packs.py (about 4.5
      # minutes alone) runs nightly and on main in slow-suites.yml, which keeps
      # this job near 5 minutes (asg-agent-team-ethan#409).
      - name: pytest
        run: pytest -q -n auto --ignore=tests/test_generate_go_packs.py
      - name: release helper tests
        run: pytest -q ../.github/test_release.py

  # Every job above tests the editable install, where the checkout is on disk
  # whatever the wheel ships. This one builds the wheel, installs it into a
  # fresh venv with its declared dependencies, and runs the schema-backed
  # calls from outside the checkout.
  clean-room-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest Python pyproject's requires-python allows, and the one the
        # other jobs use.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: build, install into a fresh venv, run the clean-room check
        run: bash scripts/clean_room_wheel.sh

  report-failure:
    needs: [test, clean-room-wheel]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: open or comment on the ci-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
