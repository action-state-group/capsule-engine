# Cross-language conformance: the Go guard (go/) against the Python reference.
#
# No path filter: a Python-only change can diverge from Go as easily as a Go
# change can (docs/design/go-guard-module.md §5, §7). The shared vectors are
# decided by both sides: `vectors` holds the Python engine at this commit to
# every expected decision (and runs the coverage gate), and `go` holds the Go
# guard to the same files (go/guard/conformance_test.go). `rust` holds the
# Rust crate (rust/) to the same files: its guard port of the inference pack
# to inference.json (reading the pack from go/packs) and its admission
# evaluator to conformance-vectors/admission/v0, so it fails when either
# drifts. `conformance` is the
# one check branch protection requires, and fails if any job it needs failed
# or was skipped.
name: conformance
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's rustup installs the toolchain rust/rust-toolchain.toml
      # pins, with rustfmt and clippy.
      - name: toolchain
        run: rustup toolchain install
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e "./python[dev]"
      - name: the embedded pack tree is what the catalog generates
        run: python scripts/generate_go_packs.py --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e "./python[dev]"
      - name: the Python engine decides every shared vector as written, and the coverage gate holds
        run: python scripts/conformance_vectors.py --check

  conformance:
    if: always()
    needs: [go, rust, packs, vectors]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        run: |
          echo 'go: ${{ needs.go.result }}, rust: ${{ needs.rust.result }}, packs: ${{ needs.packs.result }}, vectors: ${{ needs.vectors.result }}'
          test '${{ needs.go.result }}' = success
          test '${{ needs.rust.result }}' = success
          test '${{ needs.packs.result }}' = success
          test '${{ needs.vectors.result }}' = success
