# Neutrality gate — pre-merge check that this repo carries none of the
# reserved vocabulary. The reserved-term list is NOT in this repository (a
# gate listing the terms would itself disclose them); it is supplied at run
# time via the NEUTRALITY_TERMS repository secret. .github/neutrality_scan.py
# is pure matching logic parameterized by that secret, and is fail-closed: a
# missing secret fails the job rather than passing silently.
#
# To make this a required pre-merge gate, enable branch protection on `main`
# and require the "neutrality" status check (repo Settings -> Branches).
name: neutrality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reserved-vocabulary neutrality scan (term list from secret)
        env:
          NEUTRALITY_TERMS: ${{ secrets.NEUTRALITY_TERMS }}
        run: python .github/neutrality_scan.py .
