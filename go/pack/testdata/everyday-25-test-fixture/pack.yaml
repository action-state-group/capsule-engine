# TEST FIXTURE -- NOT the vendored asg/everyday/0.1.0 pack and not a published pack.
# The six obligations, action_semantics, constraints and folds are copied from
# capsule-engine 559288d0f61a everyday/pack.yaml; the nineteen outcomes are the
# semantic rows shaped as u52 specifies (forward UNAVAILABLE-MODEL-REQUIRED,
# backward MODEL-ASSISTED, mode judged, profile obligation, default_disposition),
# written here only so the binding is exercised end to end before the upstream
# rows land. Statements are addendum section 6 rule text without the leading
# disposition word. Addendum rule 1 is omitted (6 + 19 = 25; see the stanza).
pack_id: test/everyday-25-fixture/0.0.0
obligations:
  - id: purchase-over-limit
    statement: >-
      Checks each payment against the configured weekly spending limit for
      the agent making it, and flags a payment that would take that week's
      total over the limit.
    check: caps
    default_disposition: ASK
  - id: duplicate-commitment
    statement: >-
      Detects a payment that repeats one already recorded for the same
      payee by the same agent within the dedupe window, and records which
      earlier payment it matches.
    check: dedupe
    default_disposition: ASK
  - id: payment-rail-or-destination-change
    statement: >-
      Flags a payment sent over a watched rail (peer-to-peer, gift card or
      crypto) and records the rail it read.
    check: destination_rail
    default_disposition: ASK
  - id: counterparty-identity-change
    statement: >-
      Detects when the account a payee is paid into differs from the account
      last recorded for that payee, and records both account references.
    check: counterparty_identity_change
    default_disposition: ASK
  - id: credential-or-auth-code-in-outgoing-content
    statement: >-
      Detects a one-time code, a password or a card security code in
      outgoing content, and records which pattern matched without recording
      the content.
    check: credential_pattern
    default_disposition: NEVER
  - id: recurring-charge
    statement: >-
      Flags a payment that sets up a repeating charge, and records the
      recurrence the payment declared.
    check: recurring_charge
    default_disposition: ASK

action_semantics:
  - action_type: payment.make
    action_class: money.transfer
    required_fields: [amount_minor, currency, target, rail, counterparty_account_ref, recurrence]
    optional_fields: [equivalence_key, outgoing_content]
    field_aliases:
      target: payee_ref
  - action_type: message.send
    action_class: comms.external
    required_fields: [target, outgoing_content]

constraints:
  - wicket_ref: caps/1.0.0
