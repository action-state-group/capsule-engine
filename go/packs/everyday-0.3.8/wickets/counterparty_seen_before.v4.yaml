# counterparty_seen_before wicket, version 4: version 3 with one change. A
# purchase that names no payee fails as a first-time counterparty, with the
# reason "no payee named", where version 3 recorded it as not applicable.
# Not applicable never asks, so under version 3 a purchase sealing no
# counterparty went ahead while the same purchase naming a new payee asked.
# The fold is unchanged: counterparty.seen_before/3.0.0. Version 3
# (counterparty_seen_before.v3.yaml) stays as it was for the packs that pin it.
#
# `fold_digest` is the real `definition_digest()` of
# folds/catalog_defs/counterparty.seen_before.v3.yaml (folds/definition.py);
# the check refuses to run when the catalog fold does not match it.
wicket_id: counterparty_seen_before/4.0.0
check: counterparty_seen_before
semantics: >-
  For an action in action_classes, the operator's prior acts addressed to the
  action's target are counted, leaving dry runs out: an accepted decision, or
  an act whose check was approved to proceed and then executed. One or more
  passes; none fails. An act that was declined, or approved and never
  executed, is not counted. An action that names no target, or a target
  that is empty or only whitespace, fails as a first-time counterparty, with
  the reason no payee named. Any other action class is out of scope.
config:
  fold_id: counterparty.seen_before/3.0.0
  fold_digest: 73dbf8cd8a36fadca0ac823d2b17592fdc457c24081bc44667f032601e914033
  action_classes: [money.purchase]
  missing_target: unseen
