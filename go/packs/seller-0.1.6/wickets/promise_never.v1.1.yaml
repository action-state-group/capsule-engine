# promise_never/1.1.0: promise_never/1.0.0 (promise_never.yaml) with one
# exception, ruled by Steven (A7, capsule-engine#189): the user's own claim
# of a class in attributed_never may pass, said as theirs and marked
# unverified, never the agent's own. Its words, passed beside the check
# (representing_opening), must open the sealed commitment and read as one
# sentence in attributed_template; without them it fails. 1.0.0 stays as
# it was for the records and packs that pin it.
wicket_id: promise_never/1.1.0
check: promise_never
semantics: >-
  An action in action_classes whose representation_class is outside
  representation_classes fails as not recognised; one outside never passes.
  One inside never fails, whatever it cites, unless its class is in
  attributed_never, its statement_attributed_to is user, and the words
  passed beside the check open the commitment its check seals to them,
  start with attributed_template.prefix, end with
  attributed_template.suffix, and hold between them a claim that is not
  blank and has none of attributed_template.sentence_marks: then it passes.
  An attributed statement whose words are not passed fails, except on a
  replay whose bundle does not carry them: there it is not applicable, in
  scope, naming representing_opening, and fails closed. An action that carries no
  representation_class is not applicable, in scope; any other action class
  is not applicable. The evidence records the class, the attribution and
  whether the words opened and fit, never the words.
config:
  action_classes: [communication.send, disclosure.personal, marketplace.offer, marketplace.sale, agreement.accept]
  representation_classes: [price, condition, features, authenticity, availability, delivery_date, service_scope, warranty, refund_terms, payment_methods, pickup, deadline, address, other]
  never: [authenticity]
  attributed_never: [authenticity]
  attributed_template:
    prefix: "The seller says "
    suffix: " (unverified)"
    # A sentence end or a line break, in any script: every Unicode 17.0
    # Sentence_Terminal code point, every line terminator Python's
    # str.splitlines uses, and U+2026, as explicit code points so the set is
    # frozen here. capsulectl refuses the same list (attributedSentenceMarks);
    # tests/fixtures/sentence-marks.txt holds it in both repositories.
