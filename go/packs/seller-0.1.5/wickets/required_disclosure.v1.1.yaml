# required_disclosure wicket, version 1.1: version 1.0 with one change. A
# required class also counts as stated when the action's deal already holds
# a statement of it: a claim the user's agent made to the counterparty in
# that deal before the action (a capsulectl claim record sealing
# source_kind agent and the class), counted by
# disclosure.statement_seen/1.0.0. Under version 1.0 such a claim stated no
# act, so no decision carried its class and every offer and commit after it
# failed as if nothing had been said. Version 1.0
# (required_disclosure.yaml) stays as it was for the packs that pin it.
#
# Both `fold_digest` and `statement_fold_digest` are the real
# definition_digest() of their folds in folds/catalog_defs; the check refuses
# to run when a catalog fold does not match.
#
# Declared disposition: ask.
wicket_id: required_disclosure/1.1.0
check: required_disclosure
semantics: >-
  For an action in action_classes, each class in required_classes must
  already have been stated to the counterparty: by an accepted prior action
  of the operator addressed to the action's target that carried that
  representation_class, leaving dry runs out, or by a claim the operator's
  agent made in the action's deal before the action with source_kind agent
  and that class (a sealed delivery_promise reads as delivery_date). A class
  with neither fails, and an approval never clears it. A class is never read
  from a disclosure record's personal-data fields. An action naming neither
  a target nor a deal is not applicable. Any other action class is out of
  scope.
config:
  action_classes: [marketplace.offer, marketplace.sale, agreement.accept]
  representation_classes: [price, condition, features, authenticity, availability, delivery_date, service_scope, warranty, refund_terms, payment_methods, pickup, deadline, address, other]
  required_classes: [condition]
  fold_id: disclosure.class_seen/1.0.0
  fold_digest: 5b4d0280892db43c5209629137be8634be01c32d481ae79e005c4a1c6358c564
  statement_fold_id: disclosure.statement_seen/1.0.0
  statement_fold_digest: 925e7ccd2e29b3f1984f966e968bdef47d0d22d2b85b8e0205a39d6a5a7ff0be
