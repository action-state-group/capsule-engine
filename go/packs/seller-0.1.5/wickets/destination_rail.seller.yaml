# destination_rail, configured for a seller (guards/checks/
# destination_rail.py): the rails a buyer may pay on, as an allow-list. The
# check fails when Action.rail is not one of `allowed_rails`.
# destination_rail/1.0.0 (destination_rail.yaml) watches rails instead and
# stays as it was.
wicket_id: seller.destination_rail/1.0.0
check: destination_rail
config:
  action_classes: [marketplace.sale]
  allowed_rails: [card, p2p]
