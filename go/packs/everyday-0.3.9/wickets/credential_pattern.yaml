# credential_pattern wicket: regular expressions matched against
# Action.outgoing_content (guards/checks/credential_pattern.py). Each pattern
# has a stable id that appears in the evidence when it matches. A change to
# any pattern moves this definition's digest.
wicket_id: credential_pattern/1.0.0
check: credential_pattern
config:
  patterns:
    - id: one_time_code
      regex: '(?i)\b(?:one[- ]time|verification|security|login|authentication)\s+(?:code|passcode|pin)\b\D{0,20}\d{4,8}\b'
    - id: password_value
      regex: '(?i)\bpass(?:word|code)\s*(?:is|:|=)\s*\S+'
    - id: card_security_code
      regex: '(?i)\b(?:cvv|cvc|cvv2)\b\D{0,10}\d{3,4}\b'
