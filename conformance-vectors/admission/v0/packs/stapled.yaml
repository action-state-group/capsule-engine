# A test admission pack (capsule-engine#277 conformance vectors) for
# card.not_stapled, D-31: a stapled card decides T0 and nothing above; above
# T0 the pack asks for the card, or limits to T0 when the budget allows no
# ask. Every number is a placeholder.
pack_id: asg/admission_stapled_test/0.1.0
pack_version: 0.1.0
scope:
  kind: admission
source: capsule-engine#277 conformance vectors
outcomes: ["GO", "ASK", "LIMIT", "NO"]
missing: "LIMIT"
accept:
  USD: {band: USD, scale: 0}
tiers:
  - id: T0
    max_decade: {USD: 0}
  - id: T1
    max_decade: {USD: 2}
budget:
  max_asks: 1
  deadline_s: 3600
trust_roots:
  controllers: []
  witnesses: []
  judges: []
rows:
  - id: deny-list
    statement: The counterparty is not on the operator's deny list.
    source: operator
    check: operator.not_deny_listed
    from: T0
    on_fail: "NO"
  - id: card-asked
    statement: The card was asked for, not stapled to the counterparty's own message.
    source: card
    check: card.not_stapled
    from: T1
    on_fail: "LIMIT"
    ask: {derivation: history_card/1}
