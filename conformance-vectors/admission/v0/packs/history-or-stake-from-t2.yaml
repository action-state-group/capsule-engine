# history-or-stake.yaml with its ladder row from T2, so the tier below its
# from is above the lowest tier. A test admission pack for the
# per-band ladder with its two roads, earned history or posted stake
# (Reference v3 §3A.14; evidencebook-skills#79): card.band_history_or_stake,
# and a rail pinned in trust_roots. Every number is a placeholder.
pack_id: asg/admission_ladder_from_t2_test/0.1.0
pack_version: 0.1.0
scope:
  kind: admission
source: capsule-engine#265 conformance vectors; evidencebook-skills#79
outcomes: ["GO", "ASK", "LIMIT", "NO"]
missing: "LIMIT"
accept:
  USD: {band: USD, scale: 0}
  cents: {band: USD, scale: -2}
  sat: {band: sat, scale: 0}
tiers:
  - id: T0
    max_decade: {USD: 0, sat: 3}
  - id: T1
    max_decade: {USD: 1}
  - id: T2
    max_decade: {USD: 2}
  - id: T3
    max_decade: {USD: 3}
budget:
  max_asks: 1
  deadline_s: 3600
trust_roots:
  controllers: []
  witnesses: []
  judges: []
  rails: [{id: rail-a, digest: "5555555555555555555555555555555555555555555555555555555555555555"}]
rows:
  - id: deny-list
    statement: The counterparty is not on the operator's deny list.
    source: operator
    check: operator.not_deny_listed
    from: T0
    on_fail: "NO"
  - id: ladder
    statement: The card shows at least 3 subjects in a band, at most 10% of them resolved against the counterparty, and the deal is within ten times that band; or collateral on a pinned rail covers the deal.
    source: card
    check: card.band_history_or_stake
    params: {k: 3, step_decades: 1, max_adverse_permille: 100}
    from: T2
    on_fail: "LIMIT"
    ask: {derivation: served_summary/1}
