[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-engine"
version = "0.0.1"
description = "The thin single-node engine: guard, append-only fold compute, packs, policy activation, and the local console/report/bundle-viewer runtime for AI agent actions."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "guard", "fold", "capsule", "engine"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Capsule parsing goes through the public agent-action-capsule reference
# library -- never vendored into this repo. Ledger storage and the
# action-class registry are owned by the separate capsule-ledger package.
# capsule-compiler is the standalone (private, company-OSS) semantic-compiler
# package: the setup verbs (`capsule setup propose/confirm/enforce`) bridge a
# stored candidate to the real dual-compile pipeline (compilation record,
# refusal capsules, scope census) -- this is engine consuming compiler
# artifacts through its public interface, never the reverse.
dependencies = [
    "agent-action-capsule>=0.1.0",
    "capsule-ledger>=0.0.1",
    "capsule-compiler>=0.0.1",
    "capsule-emit>=0.3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-engine"
Source = "https://github.com/action-state-group/capsule-engine"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mcp>=1.0,<2.0"]
# Pinned below 2.0: the 2.0 release restructured the package (split out
# mcp-types) and dropped the `mcp.server.fastmcp` import path this server
# uses -- see capsule_engine/mcp/server.py.
mcp = ["mcp>=1.0,<2.0"]

[project.scripts]
capsule-engine = "capsule_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_engine*"]

[tool.setuptools.package-data]
capsule_engine = [
    "report/static/*.js",
    "bundle_viewer/static/*.html",
    "console/*.css",
    "console/*.html",
    "console/*.js",
    "telemetry/fixtures/*.jsonl",
    "folds/catalog_defs/*.yaml",
    "guards/wickets/catalog_defs/*.yaml",
    "policy/catalog_defs/*.yaml",
    "packs/catalog/*/pack.yaml",
    "packs/catalog/*/AI-BOOTSTRAP.md",
    "packs/catalog/*/folds/*.yaml",
    "packs/catalog/*/wickets/*.yaml",
    "packs/catalog/*/fixtures/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
