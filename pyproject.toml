[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-engine"
version = "0.0.1"
description = "The thin single-node engine: guard, append-only fold compute, packs, policy activation, and the local console/report/bundle-viewer runtime for AI agent actions."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "guard", "fold", "capsule", "engine"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Capsule parsing goes through the public agent-action-capsule reference
# library -- never vendored into this repo. Ledger storage is owned by
# checkpointed-local-log (cll). capsule-ledger keeps its own minimal,
# self-contained action-class label shim for its own core display surface;
# this package's registry/ is the fuller interim vendor-of-record copy
# -- the two are
# independent by design, not two forks of one truth.
dependencies = [
    "agent-action-capsule>=0.11.0",
    # FROZEN 2026-10-04: capsule-ledger is archived (read-only since 2026-09-02).
    # This pins its final commit (42fb45f69b06), which is what its main resolves
    # to, so nothing changes; nothing new will land there.
    # Ledger storage now comes from checkpointed-local-log below; what is still
    # imported from here is capsule_ledger.payload_store, .registry and .vectors,
    # which live only in capsule-ledger and get a new owner in #170's phase 2.
    "capsule-ledger @ git+https://github.com/action-state-group/capsule-ledger.git@42fb45f69b067f623a4b9915ae8883dff22d5d27",
    # cll.ledger: LedgerStore, LedgerAPI, ScanQuery, LedgerRecord and
    # VerificationResult. capsule_ledger.ledger.api, .store and .records were
    # module aliases for these, so the objects are the same ones. 0.6.0 is the
    # version capsule-ledger's own unbounded requirement resolved to.
    "checkpointed-local-log>=0.6.0",
    # capsule_engine/schemas/evidence-contract-v0.json's validator entry point
    # (packs/contract_validate.py).
    "jsonschema>=4.18",
    # capsule_emit.ledger_io, .period and .evidence_file: the read/verify seam,
    # --period sugar and thread-bundle check. 0.12.0 is the first release that
    # works with agent-action-capsule 0.10 and later.
    "capsule-emit>=0.12.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-engine"
Source = "https://github.com/action-state-group/capsule-engine"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mcp>=1.0,<2.0", "agentrust-trace>=0.10.0"]
# Pinned below 2.0: the 2.0 release restructured the package (split out
# mcp-types) and dropped the `mcp.server.fastmcp` import path this server
# uses -- see capsule_engine/mcp/server.py.
mcp = ["mcp>=1.0,<2.0"]
# trace-record/1 reader: depends on the
# published agentrust-trace package for TRACE v0.2 schema validation and
# signature verification -- never re-implemented or vendored. Optional: a
# deployment that never reads a TRACE record does not need this installed
# (packs/trace_reader.py imports it locally, same pattern
# capsule-emit-mesh's trace_citation.py already established).
trace = ["agentrust-trace>=0.10.0"]

[project.scripts]
capsule-engine = "capsule_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_engine*"]

[tool.setuptools.package-data]
capsule_engine = [
    "report/static/*.js",
    "bundle_viewer/static/*.html",
    "console/*.css",
    "console/*.html",
    "console/*.js",
    "telemetry/fixtures/*.jsonl",
    "folds/catalog_defs/*.yaml",
    "guards/action_taxonomy.json",
    "guards/action_taxonomy_v*.json",
    "guards/wickets/catalog_defs/*.yaml",
    "policy/catalog_defs/*.yaml",
    "packs/catalog/*/pack.yaml",
    "packs/catalog/*/AI-BOOTSTRAP.md",
    "packs/catalog/*/folds/*.yaml",
    "packs/catalog/*/wickets/*.yaml",
    "packs/catalog/*/fixtures/*.jsonl",
    "packs/catalog/*/register.yaml",
    "packs/catalog/*/obligations-register.yaml",
    "packs/catalog/*/obligations-pack-note.md",
    "packs/catalog/*/fixtures/trace/*.json",
    "examples/data/tau2_airline/*.jsonl",
    "examples/data/tau2_airline/*.json",
    "registry/*.json",
    "schemas/*.json",
    "schemas/vendor/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
