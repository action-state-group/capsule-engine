# Golden decision table for the everyday pack: action x state -> verdict,
# cross-checked row for row against the replayed fixture ledger
# (mini_ledger.jsonl) by tests/test_pack_decision_table.py, joined on the
# exact action_id each row names.
#
# "no-dead-rules": every check an obligation declares (caps, dedupe,
# destination_rail, counterparty_identity_change, credential_pattern,
# recurring_charge) has at least one 'pass' row and at least one 'fail' row.
#
# n_a: every constraint that recorded n/a declares its population, and the
# test checks the declaration against that constraint record's
# evidence_digest. Populations are never merged:
#   a -- record-attributable decline: the rule applied and the action lacked
#        the named field. Gold label "correct decline".
#   c -- out-of-scope exclusion: the rule did not apply. Never scored.
# Population b (a recording defect: n/a with no evidence) cannot be produced
# by this engine and has no row here.
#
# caps-over-limit-escalates is the row where caps is the SOLE failing check:
# it escalates, sealed as disposition.decision needs_input with
# disposition.verdict_class hitl_dispatched. caps-over-limit-on-watched-rail
# fires caps 'fail' alongside destination_rail, so it denies.
rows:
  - scenario: baseline-allow
    action_id: make_payment/everyday-fixture-baseline
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: counterparty-same-account
    action_id: make_payment/everyday-fixture-same-account
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: pass, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: counterparty-account-changed
    action_id: make_payment/everyday-fixture-account-changed
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: fail, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      credential_pattern: {population: c}
    verdict: deny
  - scenario: rail-watched
    action_id: make_payment/everyday-fixture-rail-watched
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: fail, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: deny
  - scenario: credential-in-content
    action_id: send_message/everyday-fixture-credential-in-content
    checks: {dedupe: pass, caps: n/a, verify_before_dispatch: n/a, destination_rail: n/a, counterparty_identity_change: n/a, credential_pattern: fail, recurring_charge: n/a}
    n_a:
      caps: {population: c}
      verify_before_dispatch: {population: c}
      destination_rail: {population: c}
      counterparty_identity_change: {population: c}
      recurring_charge: {population: c}
    verdict: deny
  - scenario: credential-absent
    action_id: send_message/everyday-fixture-credential-absent
    checks: {dedupe: pass, caps: n/a, verify_before_dispatch: n/a, destination_rail: n/a, counterparty_identity_change: n/a, credential_pattern: pass, recurring_charge: n/a}
    n_a:
      caps: {population: c}
      verify_before_dispatch: {population: c}
      destination_rail: {population: c}
      counterparty_identity_change: {population: c}
      recurring_charge: {population: c}
    verdict: allow
  - scenario: dedupe-original
    action_id: make_payment/everyday-fixture-dedupe-original
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: dedupe-repeat
    action_id: make_payment/everyday-fixture-dedupe-repeat
    note: "identical logical payment to dedupe-original, resubmitted"
    checks: {dedupe: fail, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: pass, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      credential_pattern: {population: c}
    verdict: deny
  - scenario: caps-boundary-at-cap
    action_id: make_payment/everyday-fixture-caps-boundary
    note: "boundary: spend == cap exactly (10,000,000); caps compares with <=, so this passes"
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: caps-first-draw
    action_id: make_payment/everyday-fixture-caps-first-draw
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: caps-over-limit-on-watched-rail
    action_id: make_payment/everyday-fixture-caps-over-limit
    note: "pooled with caps-first-draw (same developer, same window): 6,000,000 + 5,000,000 > 10,000,000"
    checks: {dedupe: pass, caps: fail, verify_before_dispatch: n/a, destination_rail: fail, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: deny
  - scenario: caps-in-scope-amount-missing
    action_id: make_payment/everyday-fixture-caps-amount-missing
    note: "population a: a cap is configured for money.transfer and the action carries no amount_minor; the engine allows it and the record names the missing field"
    checks: {dedupe: pass, caps: n/a, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      caps: {population: a, missing_field: amount_minor}
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: out-of-scope-action
    action_id: check_balance/everyday-fixture-out-of-scope
    note: "population c: no cap is configured for info.query and no configured check applies"
    checks: {dedupe: pass, caps: n/a, verify_before_dispatch: n/a, destination_rail: n/a, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: n/a}
    n_a:
      caps: {population: c}
      verify_before_dispatch: {population: c}
      destination_rail: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
      recurring_charge: {population: c}
    verdict: allow
  - scenario: recurring-charge-set-up
    action_id: make_payment/everyday-fixture-recurring-charge
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: fail}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: deny
  - scenario: caps-second-first-draw
    action_id: make_payment/everyday-fixture-caps-second-first-draw
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: allow
  - scenario: caps-over-limit-escalates
    action_id: make_payment/everyday-fixture-caps-escalates
    note: "pooled with caps-second-first-draw: 6,000,000 + 5,000,000 > 10,000,000, and caps is the only failing check"
    checks: {dedupe: pass, caps: fail, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass}
    n_a:
      verify_before_dispatch: {population: c}
      counterparty_identity_change: {population: c}
      credential_pattern: {population: c}
    verdict: escalate
