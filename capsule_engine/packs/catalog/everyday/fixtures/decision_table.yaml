# Golden decision table for the everyday pack: action x state -> verdict,
# cross-checked row for row against the replayed fixture ledger
# (mini_ledger.jsonl) by tests/test_pack_decision_table.py, joined on the
# exact action_id each row names.
#
# "no-dead-rules": every check an obligation declares (caps, dedupe,
# destination_rail, counterparty_identity_change, credential_pattern,
# recurring_charge, action_class_gate, counterparty_seen_before,
# recipient_role, refundability, material_fields_changed,
# offer_fields_changed, recipient_seen_before, channel_change,
# upfront_amount, task_authority) has at least one 'pass' row and at least
# one 'fail' row. A rule declared not measured cites no check and has no
# column here.
#
# n_a: every constraint that recorded n/a declares its population, and the
# test checks the declaration against that constraint record's
# evidence_digest. Populations are never merged:
#   a -- record-attributable decline: the rule applied and the action lacked
#        the named field. Gold label "correct decline".
#   c -- out-of-scope exclusion: the rule did not apply. Never scored.
# Population b (a recording defect: n/a with no evidence) cannot be produced
# by this engine and has no row here.
#
# caps-over-limit-escalates is the row where caps is the SOLE failing check:
# it escalates, sealed as disposition.decision needs_input with
# disposition.verdict_class hitl_dispatched. caps-over-limit-on-watched-rail
# fires caps 'fail' alongside destination_rail; caps always asks, r20
# declares ASK and money.transfer names an approver role, so it escalates too.
#
# A failing check escalates when every rule bound to it declares ASK and the
# class names an approver role: counterparty-account-changed (r19),
# rail-watched (r20), recurring-charge-set-up (r07), the five declared-input
# rows (r08 r09 r10 r21 r22) and task-outside-authority (r26) each fail one
# such check alone and escalate. dedupe-repeat (a dedupe hit in one deal) and
# credential-in-content (r23 declares NEVER) still deny.
#
# merchant-first-purchase fails counterparty_seen_before alone and escalates the
# same way: money.purchase names an approver role. merchant-repeat-purchase
# passes because merchant-history-real-payment is a real accepted payment to
# the same merchant (a dry run does not count).
# out-of-scope-action passes action_class_gate (a non-consequential class);
# booking-create fails it on r16 alone, which declares ASK, and escalates:
# booking.create names an approver role. off-taxonomy-class declares a class with no row in
# the action taxonomy, so action_class_gate fails closed as the only failing
# check and the decision denies.
#
# credential-in-content also fails recipient_seen_before: nothing accepted has
# been addressed to the support desk. r13 declares ASK and communication.send
# names an approver role (taxonomy 5), but credential_pattern (r23 NEVER)
# fails beside it, so the row still denies. credential-absent passes it because
# recipient-history-real-payment is a real accepted payment to the landlord.
# disclosure-to-fulfilling-merchant passes recipient_role and
# disclosure-to-third-party fails it; both also fail action_class_gate on
# r11 and r12, which declare ASK. disclosure.personal names an approver role,
# so the first, failing the gate alone, escalates; the second also fails
# recipient_role, which never asks, and denies. declared-terms-in-bounds
# passes refundability, material_fields_changed, offer_fields_changed,
# channel_change and upfront_amount; each of the five rows after it fails
# exactly one of them, and escalates.
# task-inside-authority passes task_authority against the record supplied
# with the decision; task-outside-authority names a payee that record's plan
# does not bind, fails it, and escalates (r26 declares ASK).
rows:
  - scenario: baseline-allow
    action_id: make_payment/everyday-fixture-baseline
    checks: {dedupe: pass, caps: pass, verify_before_dispatch: n/a, destination_rail: pass, counterparty_identity_change: n/a, credential_pattern: n/a, recurring_charge: pass, action_class_gate: n/a, counterparty_seen_before: n/a, recipient_role: n/a, refundability: n/a, material_fields_changed: n/a, offer_fields_changed: n/a, recipient_seen_before: n/a, channel_change: n/a, upfront_amount: n/a, task_authority: n/a}
    n_a:
      verify_before_dispatch: {population: c}
