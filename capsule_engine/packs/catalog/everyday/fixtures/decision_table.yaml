      credential_pattern: {population: c}
      action_class_gate: {population: c}
      counterparty_seen_before: {population: c}
      recipient_role: {population: c}
      refundability: {population: a, missing_field: refundable}
      material_fields_changed: {population: a, missing_field: material_fields_changed}
      offer_fields_changed: {population: a, missing_field: offer_fields_changed}
      recipient_seen_before: {population: c}
      channel_change: {population: a, missing_field: channel}
