# The action taxonomy this pack was authored against. The taxonomy decides
# whether a gated class asks or refuses on a failure (its approver_role), so
# the pin puts it under this pack's digest, and the pack does not load under
# any other taxonomy.
taxonomy:
  taxonomy_version: "6"
  digest: "fc12eb90bc2b3c85bb49c4d3d7be8f384c6e0b8e189bc3b68a753a4f1af5cd94"

