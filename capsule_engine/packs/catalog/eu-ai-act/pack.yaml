      conversation-turn capsules (digest-committed text) and scores the
      absence of a manipulative/deceptive technique causing significant-harm
      distortion, pinned + adjudication sample. NEW: none.
    forward_verdict: UNAVAILABLE-MODEL-REQUIRED
    backward_verdict: MODEL-ASSISTED
    tier: must_have
    mode: judged
    clause:
      instrument: Regulation (EU) 2024/1689
