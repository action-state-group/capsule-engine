  - id: EU-ANX1
    statement: >-
      All T4 rows apply to agents embedded in Annex I products (machinery,
      medical devices, vehicles, ...). Nothing new to map; the dates
      differ.
    evidence_rule: >-
      (as T4) -- no independently new evidence rule. This meta-row does not
      duplicate all 19 T4 rows a second time; it declares a scope-
