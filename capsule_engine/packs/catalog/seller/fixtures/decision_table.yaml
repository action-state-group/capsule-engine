# Golden decision table for the seller pack: action x state -> verdict,
# cross-checked row for row against the replayed fixture ledger
# (mini_ledger.jsonl) by tests/test_pack_decision_table.py, joined on the
# exact action_id each row names. Rows are in ledger order: one sale, two
# buyer threads (a, b), and a third buyer (c) never told the item's
# condition; the steps before acceptance-in-a run with no acceptance sealed.
#
# "no-dead-rules": every check an obligation declares (recipient_role,
# action_class_gate, price_floor, promise_requires_approval,
# required_disclosure, offer_expiry, destination_rail, task_authority,
# dedupe, promise_never, single_commitment, verify_before_dispatch) has at
# least one 'pass' row and at least one 'fail' row. caps is cited only so the
# engine runs; it is n/a (population c) on every row.
#
# n_a: every constraint that recorded n/a declares its population, and the
# test checks the declaration against that constraint record's
# evidence_digest. Populations are never merged:
#   a -- record-attributable decline: the rule applied and the action lacked
#        the named field. Gold label "correct decline".
#   c -- out-of-scope exclusion: the rule did not apply. Never scored.
# Population b (a recording defect: n/a with no evidence) cannot be produced
# by this engine and has no row here.
#
# A failing check escalates when every rule bound to it declares ASK and the
# class names an approver role: offer-below-floor-in-b (s03),
# offer-before-required-statement (s05), offer-on-a-stale-proposal (s06),
# offer-outside-the-task (s08), statement-warranty-unapproved (s04),
# sale-to-a-on-a-rail-not-allowed (s07), and both address rows to buyer a
# (s02, the personal_disclosure selector) each fail one such check alone.
# statement-authenticity (promise_never), pickup-told-to-a-again (dedupe in
# one deal), second-commitment-in-b (single_commitment) and
# address-citing-an-unknown-mandate (verify_before_dispatch) are integrity
# failures and deny; address-to-a-third-party fails recipient_role, whose
# rule declares DO, and denies.

rows:
  - scenario: condition-told-to-a
    action_id: tell/seller-fixture-condition-a
    checks: {dedupe: pass, caps: n/a, verify_before_dispatch: n/a, action_class_gate: n/a, recipient_role: n/a, price_floor: n/a, promise_requires_approval: pass, promise_never: pass, required_disclosure: n/a, offer_expiry: n/a, single_commitment: n/a, destination_rail: n/a, task_authority: n/a}
    n_a:
      caps: {population: c}
      verify_before_dispatch: {population: c}
      action_class_gate: {population: c}
      recipient_role: {population: c}
      price_floor: {population: c}
      required_disclosure: {population: c}
      offer_expiry: {population: c}
      single_commitment: {population: c}
      destination_rail: {population: c}
      task_authority: {population: c}
    verdict: allow
