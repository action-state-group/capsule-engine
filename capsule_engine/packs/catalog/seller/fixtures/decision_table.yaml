# Golden decision table for the seller pack: action x state -> verdict,
# cross-checked row for row against the replayed fixture ledger
# (mini_ledger.jsonl) by tests/test_pack_decision_table.py, joined on the
# exact action_id each row names. Rows are in ledger order: one sale, two
# buyer threads (a, b), and a third buyer (c) never told the item's
# condition; the steps before acceptance-in-a run with no acceptance sealed.
# Buyer b also accepts a second item (acceptance-in-b-of-item-2), so a
# sealed acceptance of another sale by another buyer exists to be cited.
#
# "no-dead-rules": every check an obligation declares (recipient_role,
# price_floor, promise_requires_approval, required_disclosure, offer_expiry,
# destination_rail, task_authority, dedupe, promise_never,
# single_commitment, verify_before_dispatch, release_on_acceptance) has at
# least one 'pass' row and at least one 'fail' row. The pack cites no caps
# definition; the engine records caps n/a (population c) on every row.
#
# n_a: every constraint that recorded n/a declares its population, and the
# test checks the declaration against that constraint record's
# evidence_digest. Populations are never merged:
#   a -- record-attributable decline: the rule applied and the action lacked
#        the named field. Gold label "correct decline".
#   c -- out-of-scope exclusion: the rule did not apply. Never scored.
# Population b (a recording defect: n/a with no evidence) cannot be produced
# by this engine and has no row here.
#
# A failing check escalates when every rule bound to it declares ASK and the
# class names an approver role: offer-below-floor-in-b (s03),
# offer-before-required-statement (s05), offer-on-a-stale-proposal (s06),
# offer-outside-the-task (s08), statement-warranty-unapproved (s04) and
# sale-to-a-on-a-rail-not-allowed (s07) each fail one such check alone.
# statement-authenticity (promise_never), pickup-told-to-a-again (dedupe in
# one deal), second-commitment-in-b (single_commitment) and every address
# row but address-to-a-after-acceptance and address-to-a-citing-b-acceptance
# (release_on_acceptance, s13; the
# unknown mandate also fails verify_before_dispatch; the row with no action
# class fails it closed) are integrity failures and deny, the approved one
# included. The pickup and other-class details deny before acceptance and
# allow after it, as the address does. address-to-a-third-party also fails
# recipient_role, whose rule declares DO.
#
# The five *-platform rows (0.1.4) give the user's data to the platform the
# item is listed on, citing no acceptance. release_on_acceptance does not
# apply to them (n/a): they reach no buyer. email-to-the-platform passes
# recipient_role and is allowed; a phone, an address, an email beside a
# phone or a disclosure naming no class fails it and denies.
#
# The three pickup rows (0.1.5) give the platform the listing's public pickup
# area (pickup_area), alone or beside an email, and the exact spot
# (pickup_location). recipient_role passes the first two and fails the third.
#
# The three listing rows (0.1.5) are offers to a fourth buyer (d), told
# nothing in chat, of a third item, each carrying the listing_classes its
# check sealed. required_disclosure passes when the listings in force state
# the condition, and fails, asking, when they do not or share no class.
#
# The share-* rows (0.1.5) are shares as capsulectl states them: the classes
# of data, the deal and the buyer's fingerprints, no statement class and no
# citation (so promise_requires_approval and promise_never are n/a, naming
# representation_class). s13 (seller.release_on_acceptance/1.2.0) reads the
# sale's acceptance from the history each share is given: the public pickup
# area passes before acceptance and to another thread's buyer; each contact
# class passes only to A in A's deal after A accepted; another buyer, a share
# naming no deal or two, one with no fingerprint and a credential fail it.
# Under 0.1.5, address-to-a-citing-b-acceptance is in A's own accepted deal
# and s13 reads no citation, so it passes.
#
# The commit-* rows (0.1.5) commit buyer A to a third item on each payment
# rail a commit may state; destination_rail (s07) now runs at the commit. Cash
# in person, Venmo and Zelle (counted as p2p) pass; cash shipped, cash with no
# handover, a rail not allowed and a commit stating no rail fail it alone and
# escalate. sale-to-a-by-venmo and sale-to-a-by-zelle pass it on the sale. The
# two acceptances state card, so destination_rail passes on them.
#
# The three proposal rows (0.1.5) are offers for a third item, never accepted.
# first-offer-answering-no-proposal carries the sealed no_proposal and no
# proposal_at: offer_expiry applied and found no proposal to age, so it is
# n/a in scope with no field missing (population a, missing_field null), and
# the offer is allowed. offer-answering-an-unnamed-message carries neither,
# and no-proposal-beside-a-proposal-time carries no_proposal beside a proposal
# time: each fails offer_expiry alone and escalates.
#
# The six statement rows at the end (0.1.5) let s04 and s10 decide. An
# ordered warranty passes s04 on the order the task authority seals, and
# asks when that record is not supplied. The user's own authenticity claim,
# attributed, with its words opened and in the template, passes s10; off
# the template, with words that do not open the checked commitment, or
# ordered but not attributed, it fails s10 and denies.

