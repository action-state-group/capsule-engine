# plan_containment wicket for the workforce-remediation demo
# (design doc: plan-containment-demo-design-2026-08-12.md §3).
#
# The compiled plan RIDES this wicket's own config (design doc §2: "a
# compiled plan IS a wicket config") -- there is no separate plan file to
# keep in sync. `capsule_engine.guards.plan.parse_plan_definition(config)`
# turns this exact mapping into the real `PlanDefinition` the
# `plan_containment` check runs against; `PlanDefinition.definition_digest()`
# over that same mapping is "the plan digest" cited in every containment
# decision's evidence.
#
# Declared outcome: workforce.remediation_completed/1.0.0 -- the employee's
# account reaches MFA-enabled state, with the employee's agreement on
# record. This is the FORWARD compile of that outcome: the actions that
# serve it, bound to one subject and one session, with `enable_mfa` gated on
# a cited agreement judgment (never a score).
wicket_id: plan_containment/1.0.0
check: plan_containment
config:
  outcome_id: workforce.remediation_completed/1.0.0
  allowed_actions:
    - read_user_directory
    - send_enrollment_link
    - enable_mfa
    - verify_mfa_state
  preconditions:
    - action: enable_mfa
      citing: agreement_judgment
  binding:
    subject: employee-4471
  window: session
