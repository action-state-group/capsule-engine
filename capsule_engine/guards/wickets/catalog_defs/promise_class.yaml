# promise_class wicket: classes of statement the agent may not make without
# an approval (guards/checks/promise_class.py). An action whose
# Action.representation_class is in `never_without_approval` fails unless it
# carries Action.authorized_by, the SHA-256 digest of the sealed approval
# record. The check reads that the reference is present and digest-shaped;
# it does not open the approval or check what it covers.
#
# `representation_classes` is the closed set; a class outside it fails
# closed.
#
# Declared disposition: never.
wicket_id: promise_class/1.0.0
check: promise_class
config:
  action_classes: [communication.send, disclosure.personal, marketplace.offer, marketplace.sale, agreement.accept]
  representation_classes: [price, condition, features, authenticity, availability, delivery_date, service_scope, warranty, refund_terms, payment_methods, pickup, deadline, address, other]
  never_without_approval: [authenticity, warranty, delivery_date]
