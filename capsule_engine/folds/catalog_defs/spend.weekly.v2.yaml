# Sum of asg_payload.amount_minor (integer minor units) per operator over a
# rolling 7-day window. Used by the caps/2.0.0 wicket: weekly_spend + this
# action's own amount, compared against the cap.
#
# Keyed by operator, the party the spend belongs to. spend.weekly/1.0.0 keys
# by developer, which names the producing software and carries its version:
# a second producer acting for the same operator, or the same agent after a
# version bump, reads a separate partition and its running total starts at
# zero. Both producers set operator, and it carries no version.
#
# Records with no asg_payload.amount_minor are skipped (no declared
# default), not treated as zero-spend evidence and never an error (spec §3
# rule 4).
fold_id: spend.weekly/2.0.0
reads:
  - path: operator
    erasure_class: commitment-ok
  - path: timestamp
    erasure_class: commitment-ok
  - path: asg_payload.amount_minor
    erasure_class: commitment-ok
  - path: disposition.decision
    erasure_class: commitment-ok
# Only accepted actions count toward spend -- a blocked/deferred decision
# capsule still carries the attempted amount_minor, but the attempt never
# ran, so it must not inflate a future cap check.
filter:
  - field: disposition.decision
    op: eq
    value: accept
key: operator
window:
  mode: rolling
  duration: 7d
reduce:
  reducer: sum
  field: asg_payload.amount_minor
emit: weekly_spend_minor
