# Count of accepted prior actions per counterparty: how many times an
# operator has already gone ahead with an action addressed to this
# asg_payload.target. Used by the counterparty_seen_before/1.0.0 wicket:
# zero means a first-time counterparty, one or more means a repeat.
#
# asg_payload.target is the same opaque counterparty reference the
# counterparty_identity_change check uses to find a payee's prior record.
# It is read as sealed on guard decision capsules; nothing new is
# collected. Records without it are skipped.
#
# The caller scans one operator's records before evaluating, so each
# operator keeps its own history (guards/checks/counterparty_seen_before.py).
fold_id: counterparty.seen_before/1.0.0
reads:
  - path: asg_payload.target
    erasure_class: commitment-ok
  - path: disposition.decision
    erasure_class: commitment-ok
# Only accepted actions make a counterparty known. A blocked or deferred
# attempt never ran.
filter:
  - field: disposition.decision
    op: eq
    value: accept
key: asg_payload.target
reduce:
  reducer: count
emit: prior_count
