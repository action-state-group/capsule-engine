[package]
name = "capsule-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "capsule-engine in Rust: the guard for the asg/inference pack, and the admission evaluator"
# The pack and definition files are embedded from ../../go/packs, outside
# this package, so it cannot be packaged on its own (publish = false).

[dependencies]
hex = "0.4"
serde = "1"
serde_json = "1"
sha2 = "0.10"
